[workspace]
resolver = "3"
members = [
    "crates/shprd-core",
    "crates/shprd-views",
    "crates/shprd-git",
    "crates/shprd-agents",
    "crates/shprd-watch",
    "crates/shprd-mux",
    "crates/shprd-mux-herdr",
    "crates/shprd-mux-hc",
    "crates/shprd-server",
    "crates/shprd-remote",
    "crates/shprd",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/jmvbambico/shprd"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
ureq = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
