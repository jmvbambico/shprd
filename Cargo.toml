[workspace]
resolver = "3"
members = [
    "crates/shprd-core",
    "crates/shprd-views",
    "crates/shprd-git",
    "crates/shprd-roster",
    "crates/shprd-watch",
    "crates/shprd-mux",
    "crates/shprd-mux-herdr",
    "crates/shprd-mux-tuios",
    "crates/shprd-tui",
    "crates/shprd",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/jmvbambico/shprd"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
