# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
# Permission modes, their cross-program map and the ask-hook facts are adapted
# from Shepherdr (MIT), core/agents.js (`MODES`, `PERM_ACROSS`, `argvFor`) and
# bin/shepherdr (`HOOKS`), tag v3.1.34, commit a3f327a.
# https://github.com/eliasstravik/shepherdr
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). M9.2 re-checked every launch, catalog and ask fact against Codex
# 0.167.0 on this machine: `codex --help`, `codex debug models` (the JSON
# catalog), `~/.codex/hooks.json` and ~/.codex/config.toml.

id = "codex"
name = "Codex"
vendor = "openai"
verified_version = "0.167.0"
# Whole phrases only, and always a fallback: the screen is read when the record
# and the retry signal say nothing, and only from the bottom lines of a stopped
# agent's pane. Bare "quota" and "429" are not patterns, because a file, a diff
# or a tool output the agent is reading must never dry its program.
# "429 Too Many Requests" is HTTP status text and the snake_case names are API
# error types; the plain English lines are conservative guesses at the CLI's
# own wording, not wording taken from a CLI's docs.
dry_patterns = [
  "429 Too Many Requests",
  "rate limit",
  "rate_limit_exceeded",
  "insufficient_quota",
  "insufficient credits",
  "usage limit reached",
]

[detect]
binary = "codex"
version_args = ["--version"]
signin_hint = "codex login"
signin_args = ["login", "status"]

[launch]
# herdr-projects starts codex for work with --no-daemon as well; it belongs to
# the base command, not to approval handling.
# The update check is off for every codex launch, worker and reviewer: codex
# opens an "Update available!" screen before it accepts a turn, and a brief
# typed into that screen is never delivered. `check_for_update_on_startup` is
# one of 0.167.0's own config keys.
interactive = ["codex", "--no-daemon", "-c", "check_for_update_on_startup=false"]
model_args = ["-m", "{model}"]
# `model_reasoning_effort` is a 0.167.0 config key; the level itself comes with
# each model in `codex debug models`.
effort_args = ["-c", "model_reasoning_effort={effort}"]
auto_approve = ["--dangerously-bypass-approvals-and-sandbox"]
# A reviewer gets no auto-approval; it gets a sandbox instead. Its working
# directory is the review packet, so workspace-write confines its writes to it.
reviewer_args = ["--sandbox", "workspace-write"]
# No system-prompt arguments: `-c developer_instructions=` has no file form,
# and herdr refuses an argument holding a newline, so a multi-line brief
# can never travel that way. It is typed in as the first turn instead.
resume_args = ["resume", "{session}"]
verified = false

[permissions]
# Shepherdr's Codex modes (M7c 2.2), each as the arguments that select it.
# `read-only` and `auto` are the sandbox plus the approval policy; `full` is the
# one flag that skips both. `codex --help` (0.167.0) takes `-s read-only`,
# `-s workspace-write`, `-a never`, `-a on-request` and
# `--dangerously-bypass-approvals-and-sandbox`.
# Shepherdr sends `-a on-request` with read-only too; shprd sends `never`, so a
# reviewer nobody sits beside never waits on an approval it cannot get.
#
# The default is the conservative one. Shepherdr's Codex default is `auto`
# (M7c 2.2); shprd starts a role that names no mode read-only, so it can never
# act unprompted until a role says otherwise.
# unverified: that a role with no mode should start at `read-only` rather than
# Shepherdr's `auto` — M9.3 decides.
default = "read-only"
full = "full"
readonly = "read-only"
modes = [
  { id = "read-only", label = "Read only", args = ["-s", "read-only", "-a", "never"] },
  { id = "auto", label = "Auto", args = ["-s", "workspace-write", "-a", "on-request"] },
  { id = "full", label = "Full access", args = ["--dangerously-bypass-approvals-and-sandbox"] },
]

[permissions.across]
# Shepherdr's PERM_ACROSS, read as "this program's nearest mode to <theirs>".
# A mode it does not name (Claude's `manual`) falls back to [permissions].default.
"claude:plan" = "read-only"
"claude:auto" = "auto"
"claude:acceptEdits" = "auto"
"claude:bypassPermissions" = "full"

# No `[fast]` section: fast here is a service tier, and codex 0.167.0's own
# catalog reports `service_tiers: []` for every model on this account, so there
# is no tier to ask for. Shepherdr's `-c service_tier="fast"` (core/agents.js)
# is not backed by this catalog; the adapter refuses `fast` for codex instead of
# sending a value the program may ignore or reject.

[models]
# `codex debug models` renders the model catalog as JSON, per signed-in account
# (0.167.0: five rows, two of them `visibility: "hide"`).
list_command = ["codex", "debug", "models"]
parser = "codex_catalog"

[models.efforts]
# The levels come with each model in that catalog
# (`supported_reasoning_levels[].effort`); the list below is the fallback for a
# catalog that cannot be read, taken from the same catalog.
source = "catalog"
levels = ["low", "medium", "high", "xhigh", "max", "ultra"]

[brief]
# Codex takes the brief as its first turn: `-c developer_instructions=` has no
# file form and an argument may not hold a newline.
delivery = "first-message"

[status]
# The agent's own OSC 7501 report first, then a hook it runs for us, then the
# bottom of its pane. Verified on this machine: herdr installs a SessionStart
# hook into ~/.codex/hooks.json, the same file the ask hook goes into below.
sources = ["osc7501", "hook", "screen"]

[asks]
# Codex fires `PermissionRequest` for an approval. Shepherdr (v3.1.34) installs
# the same hook into ~/.codex/hooks.json (the shape this machine's file already
# has: `hooks.<Event>[].hooks[]`) and waits up to 1800 s for an answer.
supported = true
config = "~/.codex/hooks.json"
format = "codex_hooks"
command = "sh '{hook}'"
timeout_seconds = 1800

[[asks.events]]
kind = "permission"
event = "PermissionRequest"

# unverified: whether Codex 0.167 fires anything for a question or a plan. Its
# `--help` and its binary's hook events list no such event, so only the
# permission card is claimed. To check: ask codex a question in a session with a
# PermissionRequest hook installed and watch whether the hook runs.

[records]
kind = "jsonl"
location = "~/.codex/sessions/{yyyy}/{mm}/{dd}/rollout-*.jsonl"
errors = "provider errors in the rollout; quota on every turn via event_msg/token_count.rate_limits"
verified = true

[quota]
source = "codex_wham"

[skills]
home_dirs = ["~/.codex/skills", "~/.agents/skills"]
project_dirs = [".agents/skills"]

# Codex offers an update on startup ("Update available!" ... "Skip until next
# version") and waits for an answer, so a brief typed in then is lost.
# `launch.interactive` switches the check off; this catches a build that
# ignores the flag.
[[blocking_prompts]]
name = "update available"
pattern = "Update available!"
