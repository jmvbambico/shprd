# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). Launch flags were re-checked with `codex --help` (0.164.0) but
# are not stated in docs/agents.md, so launch.verified is false.

id = "codex"
name = "Codex"
vendor = "openai"
verified_version = "0.164.0"
# Whole phrases only, and always a fallback: the screen is read when the record
# and the retry signal say nothing, and only from the bottom lines of a stopped
# agent's pane. Bare "quota" and "429" are not patterns, because a file, a diff
# or a tool output the agent is reading must never dry its program.
# "429 Too Many Requests" is HTTP status text and the snake_case names are API
# error types; the plain English lines are conservative guesses at the CLI's
# own wording, not wording taken from a CLI's docs.
dry_patterns = [
    "429 Too Many Requests",
    "rate limit",
    "rate_limit_exceeded",
    "insufficient_quota",
    "insufficient credits",
    "usage limit reached",
]

[detect]
binary = "codex"
version_args = ["--version"]
signin_hint = "codex login"
signin_args = ["login", "status"]

[launch]
# herdr-projects starts codex for work with --no-daemon as well; it belongs to
# the base command, not to approval handling.
# The update check is off for every codex launch, worker and reviewer: 0.164
# opens an "Update available!" screen before it accepts a turn, and a brief
# typed into that screen is never delivered.
interactive = ["codex", "--no-daemon", "-c", "check_for_update_on_startup=false"]
model_args = ["-m", "{model}"]
effort_args = ["-c", "model_reasoning_effort={effort}"]
auto_approve = ["--dangerously-bypass-approvals-and-sandbox"]
# A reviewer gets no auto-approval; it gets a sandbox instead. Its working
# directory is the review packet, so workspace-write confines its writes to it.
reviewer_args = ["--sandbox", "workspace-write"]
# No system-prompt arguments: `-c developer_instructions=` has no file form,
# and herdr refuses an argument holding a newline, so a multi-line brief
# can never travel that way. It is typed in as the first turn instead.
resume_args = ["resume", "{session}"]
verified = false

[models]
list_command = ["codex", "debug", "models"]

[records]
kind = "jsonl"
location = "~/.codex/sessions/{yyyy}/{mm}/{dd}/rollout-*.jsonl"
errors = "provider errors in the rollout; quota on every turn via event_msg/token_count.rate_limits"
verified = true

[quota]
source = "codex_wham"

[skills]
home_dirs = ["~/.codex/skills", "~/.agents/skills"]
project_dirs = [".agents/skills"]

# Codex 0.164 offers an update on startup ("Update available!" ... "Skip until
# next version") and waits for an answer, so a brief typed in then is lost.
# `launch.interactive` switches the check off; this catches a build that
# ignores the flag.
[[blocking_prompts]]
name = "update available"
pattern = "Update available!"
