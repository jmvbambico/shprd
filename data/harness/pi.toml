# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). Launch flags were re-checked with `pi --help` (1.4.0) but are not
# stated in docs/agents.md, so launch.verified is false.

id = "pi"
name = "Pi"
vendor = "pi"
# Runs other vendors' models, so the model names the vendor.
multi_model = true
verified_version = "1.4.0"
dry_patterns = [
    "rate limit",
    "usage limit",
    "quota",
    "insufficient credits",
    "429",
    "resets at",
    "rate_limit_error",
    "credit balance is too low",
]

[detect]
binary = "pi"
version_args = ["--version"]
signin_hint = "run `pi` and sign in to a provider, then `pi auth check --provider <provider>`"
signin_args = ["auth", "check", "--model", "{model}", "--no-refresh", "--json"]

[launch]
# pi cannot ask for approval, so there is no auto-approve flag.
interactive = ["pi"]
model_args = ["--model", "{model}"]
effort_args = ["--thinking", "{effort}"]
# herdr refuses an argument containing a newline, so the brief travels as a
# path: `--append-system-prompt` reads a path as well as literal text.
system_prompt_args = ["--append-system-prompt", "{prompt_file}"]
resume_args = ["--session-id", "{session}"]
verified = false

[models]
list_command = ["pi", "--list-models"]
# `pi auth check --model <name>` wants the provider too, e.g.
# `Command Code/deepseek/deepseek-v4.1-flash`; a bare model is ambiguous.
provider_qualified = true

[records]
kind = "jsonl"
location = "~/.pi/agent/sessions/{cwd_slug}/*_{session}.jsonl"
errors = "stopReason: \"error\" plus errorMessage; no reset time"
verified = true

[quota]
source = "none"
retry_signal = "json auto_retry_start"

[skills]
home_dirs = ["~/.pi/agent/skills", "~/.agents/skills"]
project_dirs = []
