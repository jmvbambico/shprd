# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). Launch flags were re-checked with `pi --help` (1.4.0) but are not
# stated in docs/agents.md, so launch.verified is false.

id = "pi"
name = "Pi"
vendor = "pi"
# Runs other vendors' models, so the model names the vendor.
multi_model = true
verified_version = "1.4.0"
# Whole phrases only, and always a fallback: the screen is read when the record
# and the retry signal say nothing, and only from the bottom lines of a stopped
# agent's pane. Bare "quota" and "429" are not patterns, because a file, a diff
# or a tool output the agent is reading must never dry its program.
# "429 Too Many Requests" is HTTP status text and the snake_case names are API
# error types; the plain English lines are conservative guesses at the CLI's
# own wording, not wording taken from a CLI's docs.
dry_patterns = [
    "429 Too Many Requests",
    "rate limit exceeded",
    "rate limit reached",
    "insufficient credits",
    "credit balance is too low",
    "usage limit reached",
]

[detect]
binary = "pi"
version_args = ["--version"]
signin_hint = "run `pi` and sign in to a provider, then `pi auth check --provider <provider>`"
signin_args = ["auth", "check", "--model", "{model}", "--no-refresh", "--json"]

[launch]
# pi cannot ask for approval, so there is no auto-approve flag.
interactive = ["pi"]
model_args = ["--model", "{model}"]
effort_args = ["--thinking", "{effort}"]
# herdr refuses an argument containing a newline, so the brief travels as a
# path: `--append-system-prompt` reads a path as well as literal text.
system_prompt_args = ["--append-system-prompt", "{prompt_file}"]
resume_args = ["--session-id", "{session}"]
verified = false

[permissions]
# pi cannot ask for an approval: `pi --help` (1.4.0) has `--approve/--no-approve`
# for trusting project files only, and no permission mode, so "ask before acting"
# is the one mode a pi role cannot have (M7c 3.2's third refusal). There are two
# modes it can keep: exactly as the person set pi up, and read-only.
default = "default"
full = "default"
readonly = "read-only"
modes = [
  { id = "default", label = "As you set it up", args = [] },
  { id = "read-only", label = "Read only", args = ["--tools", "read,grep,find,ls"] },
]

[permissions.across]
# No cross-program map: Shepherdr maps only Claude and Codex, and pi's modes are
# its own. A role that moves to pi starts at [permissions].default.

[models]
list_command = ["pi", "--list-models"]
# `pi auth check --model <name>` wants the provider too, e.g.
# `Command Code/deepseek/deepseek-v4.1-flash`; a bare model is ambiguous.
provider_qualified = true

[models.efforts]
# `pi --help` (1.4.0): `--thinking <level> ... off, minimal, low, medium, high,
# xhigh, max`.
source = "static"
levels = ["off", "minimal", "low", "medium", "high", "xhigh", "max"]

[brief]
# `--append-system-prompt` carries the brief as a path, like the launch flag
# above. pi's own help says "text or file contents"; the M7 study reads it as a
# path too (herdr-projects' table).
# unverified: that pi reads a path given to `--append-system-prompt` rather than
# appending the path itself as text — confirm on the first live launch (M9.2).
delivery = "system-prompt-file"
file = "path"

[status]
# The agent's own OSC 7501 report first, then the extension it runs for us, then
# the bottom of its pane. Verified on this machine: herdr installs
# ~/.pi/agent/extensions/herdr-agent-state.ts, which reports pi's state.
sources = ["osc7501", "hook", "screen"]

[asks]
# pi has extensions but shprd has no installer for an ask hook of its own, so
# its installer is a documented no-op (M9.5) and no card is claimed.
# unverified: whether a pi extension can hold a permission, question or plan
# ask until a person answers it — a later adapter can add it when it can.
supported = false

[records]
kind = "jsonl"
location = "~/.pi/agent/sessions/{cwd_slug}/*_{session}.jsonl"
errors = "stopReason: \"error\" plus errorMessage; no reset time"
verified = true

[quota]
source = "none"
retry_signal = "json auto_retry_start"

[skills]
home_dirs = ["~/.pi/agent/skills", "~/.agents/skills"]
project_dirs = []
