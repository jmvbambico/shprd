# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). M9.2 re-checked every launch and catalog fact against OpenCode
# 1.18.35 on this machine: `opencode --help`, `opencode models`,
# `opencode auth list` and ~/.config/opencode/plugins/.

id = "opencode"
name = "OpenCode"
vendor = "opencode"
# Runs other vendors' models, so the model names the vendor.
multi_model = true
verified_version = "1.18.35"
# Whole phrases only, and always a fallback: the screen is read when the record
# and the retry signal say nothing, and only from the bottom lines of a stopped
# agent's pane. Bare "quota" and "429" are not patterns, because a file, a diff
# or a tool output the agent is reading must never dry its program.
# "429 Too Many Requests" is HTTP status text and the snake_case names are API
# error types; the plain English lines are conservative guesses at the CLI's
# own wording, not wording taken from a CLI's docs.
dry_patterns = [
    "429 Too Many Requests",
    "rate limit exceeded",
    "rate_limit_exceeded",
    "insufficient_quota",
    "usage limit reached",
]

[detect]
binary = "opencode"
version_args = ["--version"]
signin_hint = "opencode auth login"
# `opencode providers` (`auth` is an alias) lists the credentials a person has;
# the list command is what 1.18.35 answers, and it prints no secret.
signin_args = ["auth", "list"]

[launch]
interactive = ["opencode"]
# `-m, --model` takes `provider/model`.
model_args = ["-m", "{model}"]
auto_approve = ["--auto"]
resume_args = ["--session", "{session}"]
verified = false

[permissions]
# opencode has one approval switch, `--auto` ("auto-approve permissions that are
# not explicitly denied", `opencode --help` 1.18.35), and no permission mode, so
# there are two modes: the program's own prompts, and auto-approval.
# unverified: that leaving `--auto` off really leaves opencode asking before it
# acts — the one-shot live launch in crates/shprd-agents/tests/live_launch.rs
# approves nothing, so it does not exercise it. To check: run `opencode` with no
# `--auto` and ask it to write a file.
default = "ask"
full = "auto"
modes = [
  { id = "ask", label = "Ask", args = [] },
  { id = "auto", label = "Auto", args = ["--auto"] },
]
# No read-only mode: `opencode --help` has no sandbox or tool allowlist, and
# M7c's reviewer for this program is the one-shot `opencode run`, not a launch
# flag, so no mode here is a reviewer's.

[permissions.across]
# No cross-program map: Shepherdr maps only Claude and Codex. A role that moves to
# opencode starts at [permissions].default.

[models]
# `opencode models [provider]` prints one `provider/model` per line and nothing
# else on it, which is the first-token listing the default parser reads.
list_command = ["opencode", "models"]

[models.efforts]
# `opencode --help` (1.18.35) has no effort or thinking flag, so the program
# takes none.

[brief]
# No system-prompt flag: the brief is the program's first turn. The TUI's only
# positional is `[project]`, so the brief cannot ride on the launch argv as a
# prompt; it is typed into the pane (`--prompt` exists but a multi-line brief
# may not be an argument).
delivery = "first-message"

[status]
# The agent's own OSC 7501 report first, then the plugin it runs for us, then the
# bottom of its pane. Verified on this machine: herdr installs
# ~/.config/opencode/plugins/herdr-agent-state.js, which reports opencode's state.
sources = ["osc7501", "hook", "screen"]

[asks]
# opencode has a plugin API and herdr's plugin sees `permission.asked` and
# `question.asked`; shprd has no installer for one yet, so its installer is a
# documented no-op (M9.5) and the watchdog falls back to screen detection.
# unverified: that an opencode plugin can hold an ask until a person answers it
# — a later adapter can add it when it can.
supported = false

[records]
# The database is `<XDG_DATA_HOME>/opencode/opencode.db`, which is
# `~/.local/share/opencode/opencode.db` only while `$XDG_DATA_HOME` is unset.
# OpenCode resolves its own data home, so the location says the same thing with
# `{data_home}` rather than naming the default.
kind = "sqlite"
location = "{data_home}/opencode/opencode.db"
errors = "message.data.error holds final errors; retries are not persisted"
verified = true

[transcript]
# OpenCode keeps its conversation in the `session`, `message` and `part` tables of
# the same database the watchdog reads: a `session` row names the directory the
# session belongs to, `message` holds one row a message and `part` the text and
# tool blocks of each (1.18.35 on this machine, docs/agents.md). There is no
# single file a session lives in, so the location names the database itself, and
# the reader picks the newest session whose `directory` is the space's cwd.
#
# `opencode_storage` was the pre-1.18 folder store
# (`storage/session/<project>/<id>.json` plus `storage/message/<session>/` and
# `storage/part/<message>/`); an installation that still has one is read with
# `format = "opencode_storage"` and `location = "{data_home}/opencode/storage"`
# instead. The database is what a current CLI writes, so it is what the table
# names.
format = "opencode_sqlite"
location = "{data_home}/opencode/opencode.db"

[quota]
source = "none"
retry_signal = "serve session.status"

[skills]
# docs/skills.md writes the native folder as ~/.config/opencode/skill(s); this is
# the plural location.
home_dirs = ["~/.config/opencode/skills", "~/.agents/skills", "~/.claude/skills"]
project_dirs = []
