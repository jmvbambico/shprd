# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). Launch flags were re-checked with `kilo --help` (7.7.3) but are
# not stated in docs/agents.md, so launch.verified is false.

id = "kilo"
name = "Kilo"
vendor = "kilo"
# Runs other vendors' models, so the model names the vendor.
multi_model = true
verified_version = "7.7.3"
# Whole phrases only, and always a fallback: the screen is read when the record
# and the retry signal say nothing, and only from the bottom lines of a stopped
# agent's pane. Bare "quota" and "429" are not patterns, because a file, a diff
# or a tool output the agent is reading must never dry its program.
# "429 Too Many Requests" is HTTP status text and the snake_case names are API
# error types; the plain English lines are conservative guesses at the CLI's
# own wording, not wording taken from a CLI's docs.
dry_patterns = [
    "429 Too Many Requests",
    "rate limit exceeded",
    "rate_limit_exceeded",
    "insufficient_quota",
    "usage limit reached",
]

[detect]
binary = "kilo"
version_args = ["--version"]
signin_hint = "kilo auth login"
signin_args = ["auth", "list"]

[launch]
interactive = ["kilo"]
model_args = ["-m", "{model}"]
auto_approve = ["--auto"]
resume_args = ["--session", "{session}"]
verified = false

[permissions]
# kilo has one approval switch, `--auto` ("auto-approve permissions that are not
# explicitly denied", `kilo --help`), and no permission mode, so there are two
# modes: the program's own prompts, and auto-approval.
# unverified: whether a role that wants "ask before acting" is served by the
# program's own prompt — M9.2 checks it on a live launch.
default = "ask"
full = "auto"
modes = [
  { id = "ask", label = "Ask", args = [] },
  { id = "auto", label = "Auto", args = ["--auto"] },
]
# No read-only mode: `kilo --help` has no sandbox or tool allowlist, and M7c's
# reviewer for this program is the one-shot `kilo run`, not a launch flag, so no
# mode here is a reviewer's (M9.2 decides how it reviews).

[permissions.across]
# No cross-program map: Shepherdr maps only Claude and Codex. A role that moves to
# kilo starts at [permissions].default.

[models]
list_command = ["kilo", "models"]

[models.efforts]
# `kilo --help` has no effort or thinking flag, so the program takes none.

[brief]
# No system-prompt flag: the brief is the program's first turn.
delivery = "first-message"

[status]
# The agent's own OSC 7501 report first, then the plugin it runs for us, then the
# bottom of its pane. Verified on this machine: herdr installs
# ~/.config/kilo/plugin/herdr-agent-state.js, a plugin that reports kilo's state.
sources = ["osc7501", "hook", "screen"]

[asks]
# kilo has a plugin API and herdr's plugin sees `permission.asked` and
# `question.asked`; shprd has no installer for one yet, so no card is claimed.
# unverified: that a kilo plugin can hold an ask until a person answers it —
# M9.5 checks.
supported = false

[records]
kind = "sqlite"
location = "~/.local/share/kilo/kilo.db"
errors = "message.data.error holds final errors; retries are not persisted"
verified = true

[quota]
source = "kilo_profile"
retry_signal = "serve session.status"

[skills]
home_dirs = ["~/.agents/skills", "~/.claude/skills"]
project_dirs = []
