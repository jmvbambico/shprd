# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). Launch flags were re-checked with `kilo --help` (7.7.3) but are
# not stated in docs/agents.md, so launch.verified is false.

id = "kilo"
name = "Kilo"
vendor = "kilo"
# Runs other vendors' models, so the model names the vendor.
multi_model = true
verified_version = "7.7.3"
# Whole phrases only, and always a fallback: the screen is read when the record
# and the retry signal say nothing, and only from the bottom lines of a stopped
# agent's pane. Bare "quota" and "429" are not patterns, because a file, a diff
# or a tool output the agent is reading must never dry its program.
# "429 Too Many Requests" is HTTP status text and the snake_case names are API
# error types; the plain English lines are conservative guesses at the CLI's
# own wording, not wording taken from a CLI's docs.
dry_patterns = [
    "429 Too Many Requests",
    "rate limit exceeded",
    "rate_limit_exceeded",
    "insufficient_quota",
    "usage limit reached",
]

[detect]
binary = "kilo"
version_args = ["--version"]
signin_hint = "kilo auth login"
signin_args = ["auth", "list"]

[launch]
interactive = ["kilo"]
model_args = ["-m", "{model}"]
auto_approve = ["--auto"]
resume_args = ["--session", "{session}"]
verified = false

[models]
list_command = ["kilo", "models"]

[records]
kind = "sqlite"
location = "~/.local/share/kilo/kilo.db"
errors = "message.data.error holds final errors; retries are not persisted"
verified = true

[quota]
source = "kilo_profile"
retry_signal = "serve session.status"

[skills]
home_dirs = ["~/.agents/skills", "~/.claude/skills"]
project_dirs = []
