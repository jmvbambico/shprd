# Launch flags adapted from herdr-projects (MIT), docs/agents.md, commit a6787e1.
# Copyright (c) 2026 Elias Stravik
# https://github.com/eliasstravik/herdr-projects
# Permission modes, their cross-program map and the ask-hook facts are adapted
# from Shepherdr (MIT), core/agents.js (`MODES`, `PERM_ACROSS`, `argvFor`) and
# bin/shepherdr (`HOOKS`), tag v3.1.34, commit a3f327a.
# https://github.com/eliasstravik/shepherdr
#
# Record, error and quota facts are from shprd's docs/agents.md (verified
# 2026-10-27). M9.2 re-checked every launch, catalog and ask fact against Claude
# Code 2.1.311 on this machine: `claude --help`, the strings in the 2.1.311
# binary, `~/.claude/settings.json` and data/models/claude.toml.

id = "claude"
name = "Claude Code"
vendor = "anthropic"
verified_version = "2.1.311"
# Whole phrases only, and always a fallback: the screen is read when the record
# and the retry signal say nothing, and only from the bottom lines of a stopped
# agent's pane. Bare "quota" and "429" are not patterns, because a file, a diff
# or a tool output the agent is reading must never dry its program.
# "429 Too Many Requests" is HTTP status text and the snake_case names are API
# error types; the plain English lines are conservative guesses at the CLI's
# own wording, not wording taken from a CLI's docs.
dry_patterns = [
    "429 Too Many Requests",
    "rate limit",
    "rate_limit_error",
    "insufficient credits",
    "credit balance is too low",
    "usage limit reached",
]

[detect]
binary = "claude"
version_args = ["--version"]
signin_hint = "claude auth login"
# `claude auth status` prints JSON and exits 0 when signed in (2.1.311). Its
# output names the account, so it is never shown.
signin_args = ["auth", "status"]

[launch]
interactive = ["claude"]
# `claude --help` (2.1.311): `--model <model>` takes an alias or a full name.
model_args = ["--model", "{model}"]
# `--effort <level> ... (low, medium, high, xhigh, max)`; an unknown level is a
# warning, not an error, so the adapter checks the level before it gets here.
effort_args = ["--effort", "{effort}"]
auto_approve = ["--dangerously-skip-permissions"]
# The brief travels as a file so a long one is never one argv argument.
# `--append-system-prompt-file` is not a line of its own in `--help`, but
# 2.1.311 knows it (its `--bare` help names `--append-system-prompt[-file]`, and
# the binary carries the flag) and reads the path itself.
system_prompt_args = ["--append-system-prompt-file", "{prompt_file}"]
resume_args = ["--resume", "{session}"]
verified = false

[permissions]
# Shepherdr's Claude modes (M7c 2.2), each as the arguments that select it.
# `claude --help` (2.1.311) lists the choices the CLI takes:
# acceptEdits, auto, bypassPermissions, manual, dontAsk, plan. Shepherdr sends
# `manual` as `--permission-mode default`; 2.1.311 still accepts `default` as an
# alias but no longer lists it, so the mode's own word is sent instead.
#
# `dontAsk` is offered by the CLI and has no Shepherdr mode or role behind it, so
# it is not offered here.
#
# The default is conservative: Shepherdr reads the person's own
# `permissions.defaultMode` from ~/.claude/settings.json, which a data table
# cannot, so shprd starts a role that names no mode at Ask (manual).
# Decided in M9.3: a role that names no `perm` runs this `default`; the settings
# model never substitutes a mode of its own (see `crates/shprd-core/src/settings`).
default = "manual"
full = "bypassPermissions"
readonly = "plan"
modes = [
  { id = "manual", label = "Ask", args = ["--permission-mode", "manual"] },
  { id = "auto", label = "Auto", args = ["--permission-mode", "auto"] },
  { id = "acceptEdits", label = "Accept edits", args = ["--permission-mode", "acceptEdits"] },
  { id = "plan", label = "Plan", args = ["--permission-mode", "plan"] },
  { id = "bypassPermissions", label = "Full access", args = ["--dangerously-skip-permissions"] },
]

[permissions.across]
# Shepherdr's PERM_ACROSS, read as "this program's nearest mode to <theirs>",
# so a role that moves from Codex to Claude keeps acting as it did.
"codex:read-only" = "plan"
"codex:auto" = "auto"
"codex:full" = "bypassPermissions"

[fast]
# Claude Code's fast mode is a settings key, not a flag: Shepherdr's `argvFor`
# (core/agents.js) always passes `--settings {"fastMode": <bool>}`, which wins
# over `fastMode` in the person's own settings. The 2.1.311 binary carries the
# key (`fastMode`, `fastModeChanged`, `fastModePerSessionOptIn`).
on = ["--settings", "{\"fastMode\":true}"]
off = ["--settings", "{\"fastMode\":false}"]

[models]
# Claude Code has no model-list command, so its models are a static list in
# data/models/. The spec's own `[models]` block says nothing else: no command,
# no parser.
static_list = "claude.toml"

[models.efforts]
# `claude --help` lists the levels next to its flag:
# `--effort <level> ... (low, medium, high, xhigh, max)`.
source = "static"
levels = ["low", "medium", "high", "xhigh", "max"]

[brief]
# `--append-system-prompt-file` takes a path, so a long brief is never one argv
# argument; see launch.system_prompt_args for the flag itself.
delivery = "system-prompt-file"
file = "path"

[status]
# The agent's own OSC 7501 report first, then a hook it runs for us, then the
# bottom of its pane. Verified on this machine: herdr installs SessionStart,
# PreToolUse and PostToolUse hooks into ~/.claude/settings.json (the same file
# the ask hook goes into below).
sources = ["osc7501", "hook", "screen"]

[asks]
# Claude Code fires one `PermissionRequest` hook for a permission, a question
# (`AskUserQuestion`) and a plan (`ExitPlanMode`); the payload says which. Same
# config file and entry shape as Shepherdr's HOOKS table (v3.1.34), which waits
# up to 1800 s for a person's answer.
supported = true
config = "~/.claude/settings.json"
format = "claude_settings"
command = "sh '{hook}'"
timeout_seconds = 1800

[[asks.events]]
kind = "permission"
event = "PermissionRequest"

[[asks.events]]
kind = "question"
event = "PermissionRequest"

[[asks.events]]
kind = "plan"
event = "PermissionRequest"

[records]
kind = "jsonl"
location = "~/.claude/projects/{cwd_slug}/{session}.jsonl"
errors = "isApiErrorMessage: true, error: \"rate_limit\", text with the reset time"
verified = true

[quota]
source = "anthropic_oauth"

[skills]
home_dirs = ["~/.claude/skills"]
project_dirs = []

[[blocking_prompts]]
name = "folder trust"
pattern = "Is this a project you created or one you trust"
