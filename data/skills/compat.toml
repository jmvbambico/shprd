# shprd skills compatibility list. MAINTAINER-CURATED: agents must not edit (AGENTS.md).
#
# verdict: allow  = offered and pre-ticked in setup for the listed roles
#          opt-in = offered, not pre-ticked
#          deny   = not offered by default; setup shows `reason` if the user overrides
# roles: orchestrator | worker | reviewer.  tags: task tags that pull the skill in automatically.
# reviewed_hash: the `skillFolderHash` from ~/.agents/.skill-lock.json when this entry was reviewed.
#   `shprd doctor` flags a skill whose current hash differs ("changed upstream, needs re-review").
# Reviewed 2026-10-27.

